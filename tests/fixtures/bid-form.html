<!-- Fixture sintética do formulário /project/bid/... (só a estrutura relevante, sem dados reais) -->
<div class="page-simple-content box-project-bid">
  <div class="general-info">
    <input class="tem-proposta" type="hidden" value="0">
    <input class="id-projeto" type="hidden" value="1001">
  </div>
  <table>
    <tr><th>Valor Mínimo:</th><td class="valor-minimo">R$&nbsp;1.250,50</td></tr>
  </table>
  <div class="formulario">
    <input type="tel" id="oferta" name="oferta" value="0,00">
    <input type="tel" id="duracao-estimada" name="duracao-estimada" maxlength="4" value="">
    <textarea id="proposta" maxlength="3000"></textarea>
    <div class="project-item-info">
      Esta proposta requer <b>1 conexão</b>.
      Após enviar esta proposta, você terá <b>15 conexões</b> restantes.
    </div>
    <div class="btn-group"><button id="btnConcluirEnvioProposta">Enviar proposta</button></div>
  </div>
</div>
